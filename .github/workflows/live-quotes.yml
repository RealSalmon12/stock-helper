name: 실시간 시세

# 장이 열려 있는 동안 약 5분마다 현재가를 모아 live 브랜치의 live.json 에 올립니다.
# (GitHub 예약 실행은 몇 분씩 늦어질 수 있어요.)
# live 브랜치는 매번 기록 없이 덮어써서 저장소가 커지지 않아요.

on:
  schedule:
    # 한국장 09:00~15:30 KST (00:00~06:30 UTC)
    - cron: '*/5 0-6 * * 1-5'
    # 미국장 정규장 (서머타임에 따라 13:30~21:00 UTC)
    - cron: '*/5 13-21 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch-live.mjs'
      - '.github/workflows/live-quotes.yml'

permissions:
  contents: write

concurrency:
  group: live-quotes
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 현재가 수집
        run: node scripts/fetch-live.mjs

      - name: live 브랜치에 올리기
        run: |
          mkdir -p /tmp/live && cp data/live.json /tmp/live/live.json
          cd /tmp/live
          git init -q -b live
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json
          git commit -q -m "실시간 시세 $(date -u +%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" live
